###############################################################################
#                             APPLICATION CONFIG                              #
###############################################################################

# Development options
# debug: true


spring:
  aop:
    proxy-target-class: false

# Actuators

# All actuators are exposed through HTTP for this example
management:
  endpoints:
    web:
      exposure:
        include: health,auditevents
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    auditevents:
      enabled: true

